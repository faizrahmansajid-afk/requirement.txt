<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <title>{% block title %}portfolio{% endblock %}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>

    <div class="container">
        {% with message = get_flashed_message(with_catagories=true) %}

            {% endwith %}
        {% block content %} {% endblock %}
    </div>
</body>
</html>
